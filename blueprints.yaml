name: Better Typography
slug: better-typography
type: plugin
version: 1.0.0
description: Automatically improves the typography of your content. Provides a Twig filter.
icon: font
author:
  name: Brice Boucard
  email: brice@reclic.dev
homepage: https://github.com/bricebou/grav-plugin-better-typography
demo: https://grav.reclic.dev
keywords: grav, plugin, typography, content
bugs: https://github.com/bricebou/grav-plugin-better-typography/issues
docs: https://github.com/bricebou/grav-plugin-better-typography/blob/main/README.md
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.46' }
  - { name: php, version: '>=8.3' }

form:
  validation: loose
  fields:

    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    perLanguageSettings:
      type: list
      style: vertical
      label: PLUGIN_BETTER_TYPOGRAPHY.SETTINGS_PER_LANGUAGE
      min: 1
      data-max@: 'Grav\Plugin\BetterTypographyPlugin::maxLanguages'
      fields:
        .language:
          type: select
          label: PLUGIN_BETTER_TYPOGRAPHY.LANGUAGE
          help: PLUGIN_BETTER_TYPOGRAPHY.LANGUAGE_HELP
          # The default keeps `language` as the first value of a new entry, so Admin2 shows it as the
          # title of the collapsed entry (it displays the first text value).
          default: default
          data-options@: 'Grav\Plugin\BetterTypographyPlugin::languageList'

        .useSmartQuotes:
          type: toggle
          label: PLUGIN_BETTER_TYPOGRAPHY.SMART_QUOTES
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .smartQuotesStyle:
          type: select
          size: medium
          classes: fancy
          label: PLUGIN_BETTER_TYPOGRAPHY.QUOTE_STYLE
          default: 'doubleCurled'
          options:
            'doubleCurled': '&ldquo;foo&rdquo;'
            'doubleCurledReversed': '&rdquo;foo&rdquo;'
            'doubleLow9': '&bdquo;foo&rdquo;'
            'doubleLow9Reversed': '&bdquo;foo&ldquo;'
            'singleCurled': '&lsquo;foo&rsquo;'
            'singleCurledReversed': '&rsquo;foo&rsquo;'
            'singleLow9': '&sbquo;foo&rsquo;'
            'singleLow9Reversed': '&sbquo;foo&lsquo;'
            'doubleGuillemetsFrench': '&laquo;&nbsp;foo&nbsp;&raquo;'
            'doubleGuillemets': '&laquo;foo&raquo;'
            'doubleGuillemetsReversed': '&raquo;foo&laquo;'
            'singleGuillemets': '&lsaquo;foo&rsaquo;'
            'singleGuillemetsReversed': '&rsaquo;foo&lsaquo;'
            'cornerBrackets': '&#x300c;foo&#x300d;'
            'whiteCornerBracket': '&#x300e;foo&#x300f;'

        .smartQuotesStyleSecondary:
          type: select
          size: medium
          classes: fancy
          label: PLUGIN_BETTER_TYPOGRAPHY.QUOTE_STYLE_SECONDARY
          default: 'doubleCurled'
          options:
            'doubleCurled': '&ldquo;foo&rdquo;'
            'doubleCurledReversed': '&rdquo;foo&rdquo;'
            'doubleLow9': '&bdquo;foo&rdquo;'
            'doubleLow9Reversed': '&bdquo;foo&ldquo;'
            'singleCurled': '&lsquo;foo&rsquo;'
            'singleCurledReversed': '&rsquo;foo&rsquo;'
            'singleLow9': '&sbquo;foo&rsquo;'
            'singleLow9Reversed': '&sbquo;foo&lsquo;'
            'doubleGuillemetsFrench': '&laquo;&nbsp;foo&nbsp;&raquo;'
            'doubleGuillemets': '&laquo;foo&raquo;'
            'doubleGuillemetsReversed': '&raquo;foo&laquo;'
            'singleGuillemets': '&lsaquo;foo&rsaquo;'
            'singleGuillemetsReversed': '&rsaquo;foo&lsaquo;'
            'cornerBrackets': '&#x300c;foo&#x300d;'
            'whiteCornerBracket': '&#x300e;foo&#x300f;'

        .useSmartDashes:
          type: toggle
          label: PLUGIN_BETTER_TYPOGRAPHY.SMART_DASHES
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .smartDashesStyle:
          type: select
          size: medium
          classes: fancy
          label: PLUGIN_BETTER_TYPOGRAPHY.DASHES_STYLE
          default: 'international'
          options:
            'traditionalUS': PLUGIN_BETTER_TYPOGRAPHY.DASHES_TRADITIONAL_US
            'international': PLUGIN_BETTER_TYPOGRAPHY.DASHES_INTERNATIONAL

        .singleCharacterWordSpacing:
          type: select
          size: medium
          classes: fancy
          label: PLUGIN_BETTER_TYPOGRAPHY.SINGLE_CHARACTER_WORD_SPACING
          help: PLUGIN_BETTER_TYPOGRAPHY.SINGLE_CHARACTER_WORD_SPACING_HELP
          default: 'auto'
          options:
            'auto': PLUGIN_BETTER_TYPOGRAPHY.SINGLE_CHARACTER_WORD_SPACING_AUTO
            'enabled': PLUGIN_ADMIN.ENABLED
            'disabled': PLUGIN_ADMIN.DISABLED

        .applyHyphenations:
          type: toggle
          label: PLUGIN_BETTER_TYPOGRAPHY.HYPHENATIONS
          highlight: 0
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .applyFrenchSpecific:
          type: toggle
          label: PLUGIN_BETTER_TYPOGRAPHY.FRENCH
          help: PLUGIN_BETTER_TYPOGRAPHY.FRENCH_HELP
          highlight: 0
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .useSmartDiacritics:
          type: toggle
          label: PLUGIN_BETTER_TYPOGRAPHY.DIACRITICS
          help: PLUGIN_BETTER_TYPOGRAPHY.DIACRITICS_HELP
          highlight: 0
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        .smartDiacriticsLanguage:
          type: select
          size: medium
          classes: fancy
          label: PLUGIN_BETTER_TYPOGRAPHY.DIACRITICS_LANGUAGE
          default: ''
          options:
            '': ''
            'de-DE': 'de-DE'
            'en-US': 'en-US'